# A test instance's perk values, invented: what the transaction data cannot
# say. Annual dollars, low / base / high.
#
# Honest way to fill these: value = what you would otherwise have paid, not
# the list price of the perk.

[prime.shipping]
note = "Orders that would have paid shipping or been bundled to hit a free-ship minimum"
low = 0
base = 20
high = 60

[prime.video]
note = "Recorded 2026-08-02: $0 a year"
low = 0
base = 0
high = 0

[prime.pharmacy]
note = "Prime Rx pricing vs a local pharmacy on what you actually fill."
low = 0
base = 5
high = 25

[prime.rxpass]
ask = "What would your prescription cost without RxPass?"
how = "Price it for a year at another pharmacy or on GoodRx, then take off $60 for the RxPass subscription. What is left is the answer; it can be negative."
note = "RxPass needs Prime: $5/mo for one subscription. Value = what the script costs elsewhere minus $60. PLACEHOLDER: price it and replace."
low = 0
base = 90
high = 300

[prime.one_medical]
ask = "Are you keeping One Medical?"
how = "With Prime it costs $108 a year against $199 without, so keeping it is worth $91 a year of Prime. Cancelling makes it worth nothing."
low_if = "No, I'll cancel it"
high_if = "Yes, keeping it"
note = "Recorded 2026-08-02: not a member, $0 a year"
low = 0
base = 0
high = 0

[walmart_plus.delivery]
ask = "Without Walmart+, would you pay for grocery delivery?"
how = "A weekly order is 52 deliveries a year. Paid delivery elsewhere runs about $8-10 an order; free pickup costs nothing but time."
low_if = "No, I'd use free pickup"
high_if = "Yes, I'd pay about $9 an order"
note = "Recorded 2026-08-02: $60 a year, a few paid deliveries plus gas for pickup trips"
low = 60
base = 60
high = 60

[walmart_plus.fuel]
note = "Per-gallon discount × gallons actually bought at participating stations"
low = 0
base = 0
high = 0

[walmart_plus.streaming]
note = "Recorded 2026-08-02: $0 a year"
low = 0
base = 0
high = 0

[costco.prices]
ask = "Is Costco cheaper on what you buy there?"
how = "Compare receipts on the few items you buy at both stores. It only counts if you actually move them. Negative if Costco makes you buy more than you use."
low_if = "No real saving"
note = "Costco vs your usual store on the basket you actually buy there; measured ~$50/yr, not yet taken as the answer."
measured = 50
measured_if = "Move coffee and paper goods to Costco"
low = 0
base = 0
high = 0

[costco.gas]
ask = "Is Costco gas cheaper than your usual station?"
how = "Cents a gallon cheaper times gallons a year at Costco. The card side of Costco gas is counted already; this is the pump price only."
low_if = "No real saving"
note = "Costco pump price vs nearest alternative × gallons"
low = 0
base = 0
high = 0

